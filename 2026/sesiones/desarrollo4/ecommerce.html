<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TecnoStore | Catálogo Din\u00e1mico</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #111;
        color: #f1f1f1;
        font-size: 16px;
      }
      a {
        color: aqua;
      }

      /* ============================================= */
      /* GRID #1: estructura general de la página        */
      /* ============================================= */
      #pagina {
        display: grid;
        grid-template-columns: 220px 1fr;
        grid-template-rows: auto 1fr auto;
        grid-template-areas:
          "header header"
          "nav    main"
          "footer footer";
        min-height: 100vh; /* la página ocupa como mínimo toda la pantalla */
        gap: 16px;
      }

      header {
        grid-area: header;
        background: #1c1c1c;
        padding: 16px;
      }
      nav {
        grid-area: nav;
        background: #161616;
        padding: 16px;
      }
      main {
        grid-area: main;
        padding: 0 16px;
      }
      footer {
        grid-area: footer;
        background: #1c1c1c;
        padding: 16px;
        text-align: center;
      }

      /* Dentro de 
, el aside NO forma parte del grid de #pagina:
   para incluirlo en la estructura general, se agregaría una
   columna/área extra "aside" 
    */

      /* ============================================= */
      /* GRID #2: catálogo de productos, DISEÑO ADAPTATIVO */
      /* ============================================= */
      /* .catalogo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        padding: 20px 0;
      } */

      .product-card {
        background-color: #1c1c1c;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 16px;
        display: grid; /* Grid también DENTRO de la tarjeta */
        grid-template-rows: auto auto auto auto;
        justify-items: center;
        gap: 10px;
      }

      .product-card img {
        max-width: 100%;
        border-radius: 6px;
      }
      .product-card .price {
        font-weight: bold;
        color: #4fd1c5;
      }
      .product-card button {
        background-color: #4fd1c5;
        color: #08131a;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 1rem;
        cursor: pointer;
      }

      /* Único @media necesario: en pantallas chicas,
   la barra de navegación pasa a ocupar todo el ancho arriba
   (la grilla del catálogo YA es responsiva sin @media) */
      @media (max-width: 700px) {
        #pagina {
          grid-template-columns: 1fr;
          grid-template-areas:
            "header"
            "nav"
            "main"
            "footer";
        }
      }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
