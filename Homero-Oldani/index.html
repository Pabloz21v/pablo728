<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Apple</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <header>
    <h1>Catálogo Apple</h1>
    <button id="btn-nuevo" class="azul">+ Agregar producto</button>
  </header>

  <main>

    <section>
      <h2>Productos</h2>
      <p class="aviso">Datos y precios de ejemplo, en dólares.</p>
      <div id="lista-productos" class="grilla"></div>
    </section>

    <section id="seccion-form" hidden>
      <h2 id="titulo-form">Agregar producto</h2>

      <form id="form-producto">
        <input type="hidden" id="producto-id">

        <label>Nombre
          <input id="nombre" required>
        </label>

        <label>Categoría
          <select id="categoria">
            <option>iPhone</option>
            <option>Mac</option>
            <option>iPad</option>
            <option>Watch</option>
            <option>Audio</option>
            <option>Accesorios</option>
          </select>
        </label>

        <label>Descripción
          <input id="descripcion">
        </label>

        <label>Imagen (ruta o URL)
          <input id="imagen" placeholder="img/iphone-16.jpg">
        </label>

        <label>Precio (US$)
          <input id="precio" type="number" min="0" required>
        </label>

        <label>Stock
          <input id="stock" type="number" min="0" value="1" required>
        </label>

        <div class="botones">
          <button type="submit">Guardar</button>
          <button type="button" id="btn-cancelar" class="gris">Cancelar</button>
        </div>
      </form>
    </section>

  </main>
