<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="café, café de especialidad, accesorios, pastelería">
    <meta name="description" content="Aroma Café: catálogo de café de especialidad, accesorios y pastelería.">
    <title>Aroma Café | Catálogo</title>

    <!-- Hoja de estilos externa (Sesión 3) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <img src="img/logo.svg" alt="Logo de Aroma Café: taza de café humeante" class="logo">
        <div>
            <h1>Aroma Café</h1>
            <p>Café de especialidad, accesorios y pastelería</p>
        </div>
    </header>

    <!-- UN SOLO main por documento (Sesión 1) -->
    <main>

        <!-- Barra de búsqueda y filtro: elementos que JS va a "escuchar" -->
        <section class="barra-filtros" id="filtros">
            <h2>Buscar productos</h2>

            <div class="campo">
                <label for="buscador">Nombre del producto</label>
                <input type="text" id="buscador" name="buscador" placeholder="Ej: café, taza, brownie">
            </div>

            <div class="campo">
                <label for="filtro-categoria">Categoría</label>
                <select id="filtro-categoria" name="filtro-categoria">
                    <option value="todas">Todas las categorías</option>
                    <option value="granos">Granos de café</option>
                    <option value="accesorios">Accesorios</option>
                    <option value="pasteleria">Pastelería</option>
                </select>
            </div>

            <button type="button" id="btn-nuevo" class="btn btn-primario">+ Nuevo producto</button>
        </section>

        <!-- Formulario de alta/edición: oculto hasta que se necesite -->
        <section id="seccion-formulario">
            <form id="form-producto" class="form-producto oculto">
                <h2 id="form-titulo" class="campo-ancho">Nuevo producto</h2>

                <div class="campo">
                    <label for="input-nombre">Nombre</label>
                    <input type="text" id="input-nombre" name="nombre" required>
                </div>

                <div class="campo">
                    <label for="input-categoria">Categoría</label>
                    <select id="input-categoria" name="categoria">
                        <option value="granos">Granos de café</option>
                        <option value="accesorios">Accesorios</option>
                        <option value="pasteleria">Pastelería</option>
                    </select>
                </div>

                <div class="campo campo-ancho">
                    <label for="input-descripcion">Descripción</label>
                    <textarea id="input-descripcion" name="descripcion" rows="2"></textarea>
                </div>

                <div class="campo">
                    <label for="input-precio">Precio (USD)</label>
                    <input type="number" id="input-precio" name="precio" step="0.01" min="0" required>
                </div>

                <div class="campo">
                    <label for="input-stock">Stock</label>
                    <input type="number" id="input-stock" name="stock" min="0" required>
                </div>

                <div class="campo campo-ancho">
                    <label for="input-imagen">URL de la imagen (opcional)</label>
                    <input type="text" id="input-imagen" name="imagen" placeholder="https://...">
                </div>

                <div class="acciones-form campo-ancho">
                    <button type="submit" class="btn btn-primario">Guardar</button>
                    <button type="button" id="btn-cancelar" class="btn btn-secundario">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- GANCHO VACÍO: acá JS va a inyectar un <article> por cada producto -->
        <section id="catalogo">
            <h2>Nuestros productos</h2>
            <p id="contador">Cargando productos...</p>
            <div id="contenedor-productos" class="catalogo-grid"></div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Aroma Café. Proyecto académico - Desarrollo IV.</p>
    </footer>

    <!-- El JS va al final del body para que el HTML ya exista (Sesión 7) -->
    <script src="js/app.js"></script>
</body>
</html>
