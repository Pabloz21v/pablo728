<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arasaka Tech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="text-center py-4">
        <h1>Arasaka Tech</h1>
        <p>Tecnología de un futuro que todavía no existe</p>
    </header>

    <main class="container my-4">
        <section class="card p-3 mb-4">
            <h2 id="titulo-formulario">Agregar producto</h2>
            <form id="form-producto">
                <input type="hidden" id="producto-id">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="categoria" class="form-label">Categoría</label>
                        <input type="text" id="categoria" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label for="precio" class="form-label">Precio (créditos)</label>
                        <input type="number" id="precio" class="form-control" min="0" required>
                    </div>
                    <div class="col-md-6">
                        <label for="imagen" class="form-label">Imagen (URL o ruta, opcional)</label>
                        <input type="text" id="imagen" class="form-control">
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <button type="button" id="cancelar" class="btn btn-secondary" hidden>Cancelar</button>
                </div>
            </form>
        </section>

        <section>
            <h2>Productos</h2>
            <div class="row g-3" id="lista-productos"></div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
